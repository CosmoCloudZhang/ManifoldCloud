# ManifoldConda: the single environment for the ManifoldCloud project (macOS).
#
# Run these from the repository root. The last line of this file installs the
# manifoldcloud package from this folder, so the folder must stay in place.
#
# Create:   conda env create -f environment.yml
# Activate: conda activate ManifoldConda        (the name is case-sensitive)
# Check:    python scripts/check_environment.py
# Update:   conda env update -n ManifoldConda -f environment.yml --prune
#
# Versions are pinned to the minor release so that a later install matches the
# one used to acquire the data. Add a package here, never with a bare
# `conda install` or `pip install`, so every copy of the environment agrees.
name: ManifoldConda
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- numerics, tables and plots ------------------------------------------
  - numpy=2.5
  - scipy=1.18
  - pandas=3.1
  - astropy=8.0          # FITS tables, units, cosmology
  - matplotlib
  # --- catalogue files -------------------------------------------------------
  - h5py=3.16            # Diffsky HDF5 shells
  - hdf5plugin=7.1       # Blosc2 filter used by the Diffsky files
  - pyarrow=26           # Parquet tables
  - python-duckdb=2.0    # summaries of large Parquet files without loading them
  # --- remote access ---------------------------------------------------------
  - fsspec               # HTTP byte ranges for the Diffsky shells
  - aiohttp
  - requests             # CosmoHub
  # --- photometry ------------------------------------------------------------
  - speclite=0.20        # Rubin filter curves
  # --- manifold learning -----------------------------------------------------
  - scikit-learn=1.9     # PCA, k-means, scaling, splits
  - umap-learn=0.6       # UMAP
  - numba=0.68           # compiled by umap-learn; pinned because it affects results
  - opentsne=1.0         # t-SNE that can place new points on a frozen map
  - minisom=2.3          # pure-Python SOM
  - somoclu=1.7          # fast C++ SOM, required by RAIL's SOM stages
  # --- RAIL: photometric-redshift tools from LSST DESC -----------------------
  - pz-rail-base=2.0     # stages, tomographic binning, metrics
  - qp-prob=1.1          # redshift distributions as ensembles
  - tables-io=1.1        # table reading and writing used by RAIL
  # --- notebooks -------------------------------------------------------------
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm
  # --- tests -----------------------------------------------------------------
  - pytest
  - responses            # mocked HTTP in tests
  # --- PyPI only -------------------------------------------------------------
  - pip
  - pip:
      - photerr==1.6.0       # Rubin noise model; conda-forge is one release behind
      - pz-rail-som==2.0.1   # RAIL SOM informer and summarizer
      - -e .                 # this repository's manifoldcloud package
